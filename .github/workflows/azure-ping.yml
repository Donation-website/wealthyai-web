name: Azure Multi-Workload Sustained Ping

on:
  schedule:
    - cron: '0 */3 * * *' # 3 óránként fut le automatikusan, tartós mintát adva
  workflow_dispatch: # Kézi indítási gomb a teszteléshez

jobs:
  ping-all-workloads:
    runs-on: ubuntu-latest
    steps:
      - name: Ping All 5 Azure Services
        run: |
          echo "=== 1. SQL Database (mywealthyai-db) ==="
          nc -zv -w 5 mywealthyai-server-2026.database.windows.net 1433 || true

          echo "=== 2. Azure OpenAI (jobsandcv-ai-engine) ==="
          curl -I -s -o /dev/null -w "%{http_code}\n" "https://jobsandcv-ai-engine.openai.azure.com/" || true

          echo "=== 3. Cognitive Search (jobs-search-cv) ==="
          curl -I -s -o /dev/null -w "%{http_code}\n" "https://jobs-search-cv.search.windows.net/" || true

          echo "=== 4. Document Intelligence (mywealthyai-doc-reader) ==="
          curl -I -s -o /dev/null -w "%{http_code}\n" "https://mywealthyai-doc-reader.cognitiveservices.azure.com/" || true

          echo "=== 5. Communication Service (mywealthyai-communication) ==="
          curl -I -s -o /dev/null -w "%{http_code}\n" "https://mywealthyai-communication.communication.azure.com/" || true
          
          echo "Kész, az összes erőforrás megpöccintve, az Azure naplózza az aktivitást."
